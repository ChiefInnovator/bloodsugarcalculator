name: Validate static application

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Calculator regression tests
        run: node --test tests/*.test.js
      - name: JavaScript syntax
        run: |
          node --check js/calculator.js
          node --check js/script.js
      - name: Publisher and launcher regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Shell launcher syntax
        run: sh -n .agents/skills/impeccable/scripts/impeccable
      - name: Build approved static assets
        run: python3 scripts/build_static.py
