name: Branch policy

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  statuses: write

jobs:
  branch-policy:
    name: Validate promotion source
    runs-on: ubuntu-latest
    steps:
      # Read trusted event metadata only. Never check out or execute PR code here.
      - name: Validate source branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description="Source branch follows the promotion policy."
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            state=failure
            description="Protected branches only accept this repository's branches."
          elif [[ "$BASE_REF" == main && "$HEAD_REF" != develop ]]; then
            state=failure
            description="main only accepts pull requests from develop."
          elif [[ "$BASE_REF" == develop && ( "$HEAD_REF" != feature/* || "$HEAD_REF" == feature/ ) ]]; then
            state=failure
            description="develop only accepts feature/<topic>."
          elif [[ "$BASE_REF" != main && "$BASE_REF" != develop ]]; then
            state=failure
            description="Unsupported target branch."
          fi
          # pull_request_target runs on the base commit. Publish the required
          # status on the exact PR head so an earlier/base result cannot satisfy it.
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context="branch-policy/$BASE_REF" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == success ]] || {
            echo "::error::$description"
            exit 1
          }
